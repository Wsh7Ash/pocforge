[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pocforge"
version = "1.0.0"
description = "Grade bug-bounty proof-of-concepts on scope, oracles, negative controls and tamper-evident evidence."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wsh7Ash" }]
keywords = ["bug-bounty", "proof-of-concept", "triage", "evidence", "verification", "skills"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pocforge = "pocforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
